name: Deploy production (manual)
on:
  workflow_dispatch:
    inputs:
      release:
        description: Full lowercase commit SHA of the published release
        type: string
        required: true
      scope:
        description: Services to deploy
        type: choice
        options: [web, app, api, rimworld, beekeeper, all]
        default: web
      maintenance:
        description: Approve game downtime if replacing the game container
        type: boolean
        default: false
      dry_run:
        description: Produce a plan without changing services
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Request scoped deployment over verified SSH
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          SCOPE: ${{ inputs.scope }}
          MAINTENANCE: ${{ inputs.maintenance }}
          DRY_RUN: ${{ inputs.dry_run }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set production environment secret VPS_HOST}"
          : "${VPS_USER:?Set production environment secret VPS_SSH_USER}"
          : "${SSH_KEY:?Set production environment secret VPS_SSH_PRIVATE_KEY}"
          : "${SSH_HOSTS:?Set production environment secret VPS_SSH_KNOWN_HOSTS}"
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA' >&2; exit 2; }
          case "$SCOPE" in web|app|api|rimworld|beekeeper|all) ;; *) exit 2;; esac
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]{0,252}$ ]] || exit 2
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ && "$VPS_USER" != root ]] || exit 2
          port="${VPS_SSH_PORT:-22}"
          [[ "$port" =~ ^[1-9][0-9]{0,4}$ ]] && (( port <= 65535 )) || exit 2
          maintenance=0; dry=0
          if [[ "$MAINTENANCE" == true ]]; then maintenance=1; fi
          if [[ "$DRY_RUN" == true ]]; then dry=1; fi
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -f "$tmp/key" "$tmp/known_hosts"; rmdir "$tmp"' EXIT
          printf '%s\n' "$SSH_KEY" > "$tmp/key"
          printf '%s\n' "$SSH_HOSTS" > "$tmp/known_hosts"
          ssh -p "$port" -i "$tmp/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" "rwt-deploy $RELEASE $SCOPE $maintenance $dry"
