services:
  postgres:
    image: postgres:${POSTGRES_VERSION:?POSTGRES_VERSION is required}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      RIMWORLD_ADMIN_PASSWORD: ${RIMWORLD_ADMIN_PASSWORD:?RIMWORLD_ADMIN_PASSWORD is required}
      RIMWORLD_WEB_DB_PASSWORD: ${RIMWORLD_WEB_DB_PASSWORD:?RIMWORLD_WEB_DB_PASSWORD is required}
      RIMWORLD_API_DB_PASSWORD: ${RIMWORLD_API_DB_PASSWORD:-}
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:

networks:
  app_network:
